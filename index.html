<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="app/assets/manifest.json">
    <title>Bubble Zap 3D</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            touch-action: none; 
        }
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
        
        #ui-layer {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            pointer-events: none; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            padding: 20px; 
            box-sizing: border-box; 
            z-index: 10;
        }

        .hud-top {
            display: flex; 
            justify-content: space-between; 
            width: 100%; 
            max-width: 800px; 
            margin: 0 auto;
            color: white; 
            font-size: 18px; 
            font-weight: bold; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        #overlay {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            z-index: 100; 
            transition: opacity 0.4s ease;
        }

        #overlay.hidden { 
            opacity: 0; 
            pointer-events: none; 
        }

        .panel {
            background: transparent;
            padding: 40px; 
            text-align: center; 
            max-width: 80%;
        }

        h1 {
            color: #fff; 
            font-size: clamp(32px, 8vw, 64px); 
            margin: 0;
            background: linear-gradient(45deg, #00f260, #0575e6);
            background-clip: text;
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        h2 { 
            color: #4facfe; 
            font-weight: 300; 
            margin: 10px 0 20px 0; 
        }
        
        p { 
            color: #ccc; 
            margin-bottom: 30px; 
            line-height: 1.5; 
        }

        button {
            background: #fff; 
            color: #000; 
            border: none; 
            padding: 16px 60px;
            font-size: 20px; 
            font-weight: bold; 
            border-radius: 50px; 
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            pointer-events: auto;
        }

        button:hover { 
            transform: scale(1.05); 
            background: #4facfe; 
            color: #fff; 
        }

        #overlay.hidden button {
            pointer-events: none;
        }

        /* Victory finale screen - colorful celebration */
        #overlay.victory-finale {
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 0, 255, 0.5) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 255, 255, 0.5) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 215, 0, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 60% 80%, rgba(255, 100, 0, 0.4) 0%, transparent 50%),
                radial-gradient(circle at center, #1a0033 0%, #000000 100%) !important;
            animation: colorShift 8s ease-in-out infinite !important;
            overflow: hidden;
        }

        #overlay.victory-finale::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 255, 255, 0.03) 2px, rgba(255, 255, 255, 0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255, 255, 255, 0.03) 2px, rgba(255, 255, 255, 0.03) 4px);
            animation: scanlines 20s linear infinite;
            pointer-events: none;
        }

        #overlay.victory-finale::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 50%, rgba(255, 0, 128, 0.6) 0%, transparent 20%),
                radial-gradient(circle at 70% 50%, rgba(0, 212, 255, 0.6) 0%, transparent 20%),
                radial-gradient(circle at 50% 30%, rgba(255, 215, 0, 0.5) 0%, transparent 20%),
                radial-gradient(circle at 50% 70%, rgba(162, 0, 255, 0.5) 0%, transparent 20%);
            animation: backgroundPulse 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        #overlay.victory-finale .panel {
            position: relative;
            z-index: 2;
        }

        #overlay.victory-finale h1 {
            font-size: clamp(50px, 12vw, 100px);
            background: linear-gradient(90deg, 
                #ff0080, #ff8c00, #ffd700, #00ff88, #00d4ff, #a200ff, #ff0080) !important;
            background-size: 200% 100% !important;
            animation: rainbowSlide 3s linear infinite, float 3s ease-in-out infinite !important;
            background-clip: text !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.9))
                    drop-shadow(0 0 80px rgba(255, 0, 255, 0.8))
                    drop-shadow(0 0 120px rgba(0, 255, 255, 0.6)) !important;
            letter-spacing: 0.15em;
            margin: 20px 0;
        }

        #overlay.victory-finale h2 {
            color: #fff !important;
            font-size: clamp(24px, 5vw, 40px);
            text-transform: uppercase;
            letter-spacing: 0.3em;
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00) !important;
            background-clip: text !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            animation: textGlow 2s ease-in-out infinite alternate !important;
            margin: 20px 0;
            filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.8)) !important;
        }

        #overlay.victory-finale p {
            color: #fff !important;
            font-size: clamp(18px, 3vw, 28px);
            font-weight: 600;
            white-space: pre-wrap;
            line-height: 2;
            text-shadow: 
                0 0 10px rgba(0, 255, 255, 1),
                0 0 20px rgba(255, 0, 255, 0.8),
                0 0 40px rgba(255, 215, 0, 0.6) !important;
            animation: textPulse 1.5s ease-in-out infinite !important;
            margin: 30px 0;
        }

        #overlay.victory-finale button {
            background: linear-gradient(135deg, 
                #ff0080, #ff8c00, #ffd700, #00ff88, #00d4ff, #a200ff) !important;
            background-size: 300% 300% !important;
            animation: gradientShift 4s ease infinite !important;
            color: #000 !important;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            box-shadow: 
                0 0 40px rgba(255, 0, 255, 1),
                0 0 80px rgba(0, 255, 255, 0.8),
                inset 0 0 30px rgba(255, 255, 255, 0.4) !important;
            border: 3px solid rgba(255, 255, 255, 0.9) !important;
            border-radius: 50px !important;
            padding: 18px 40px !important;
            transition: all 0.3s ease;
        }

        #overlay.victory-finale button:hover {
            transform: scale(1.15) rotate(-2deg);
            box-shadow: 
                0 0 50px rgba(255, 0, 255, 1),
                0 0 100px rgba(0, 255, 255, 0.8),
                inset 0 0 30px rgba(255, 255, 255, 0.5);
            border-color: #fff;
        }

        @keyframes colorShift {
            0%, 100% { filter: hue-rotate(0deg) brightness(1); }
            25% { filter: hue-rotate(90deg) brightness(1.1); }
            50% { filter: hue-rotate(180deg) brightness(1.2); }
            75% { filter: hue-rotate(270deg) brightness(1.1); }
        }

        @keyframes backgroundPulse {
            0%, 100% { 
                transform: translate(0, 0) scale(1);
                opacity: 0.8;
            }
            50% { 
                transform: translate(-5%, -5%) scale(1.1);
                opacity: 1;
            }
        }

        @keyframes rainbowSlide {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes textGlow {
            from { 
                filter: drop-shadow(0 0 10px rgba(255, 0, 255, 0.8)) brightness(1);
                transform: scale(1);
            }
            to { 
                filter: drop-shadow(0 0 30px rgba(0, 255, 255, 1)) brightness(1.3);
                transform: scale(1.05);
            }
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        /* Landscape orientation warning */
        #orientation-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            text-align: center;
            padding: 20px;
        }

        @media (orientation: landscape) and (max-width: 900px) {
            #orientation-warning {
                display: flex;
            }
        }

        .rotate-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: rotate 2s infinite;
        }

        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
    </style>
</head>
<body>
    <!-- Orientation Warning -->
    <div id="orientation-warning">
        <div class="rotate-icon">📱</div>
        <div>Please rotate your device to portrait mode</div>
    </div>

    <div id="ui-layer">
        <div class="hud-top">
            <div>LVL: <span id="level-el" style="color:#ffeb3b">1</span></div>
            <div>POPS: <span id="score-el" style="color:#4facfe">0</span> / <span id="target-el">10</span></div>
            <div>TIME: <span id="time-el" style="color:#ff4b2b">0</span>s</div>
        </div>
    </div>

    <div id="overlay">
        <div class="panel">
            <h1 id="main-title">BUBBLE ZAP</h1>
            <h2 id="sub-title">Loading...</h2>
            <p id="level-desc">Prepare for the void.</p>
            <button id="start-btn">START</button>
        </div>
    </div>

    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Special Bubbles Config -->
    <script src="app/js/specialbubbles.js"></script>

    <!-- Hazard Module -->
    <script src="app/js/hazards.js"></script>

    <!-- Game Logic -->
    <script src="app/js/game.js"></script>

    <!-- Service Worker Registration for PWA -->
    <script>
        // Lock screen orientation to portrait on mobile devices
        async function lockOrientation() {
            try {
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('portrait-primary');
                    console.log('Screen orientation locked to portrait');
                }
            } catch (err) {
                console.log('Screen orientation lock not supported or failed:', err);
            }
        }

        // Try to lock orientation when the page loads
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            lockOrientation();
        }

        // Lock orientation when entering fullscreen
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                lockOrientation();
            }
        });

        document.addEventListener('webkitfullscreenchange', () => {
            if (document.webkitFullscreenElement) {
                lockOrientation();
            }
        });

        // Conditionally register service worker based on environment
        if ('serviceWorker' in navigator) {
            fetch('/api/env')
                .then(res => res.json())
                .then(data => {
                    if (data.env !== 'dev') {
                        navigator.serviceWorker.register('./app/js/sw.js').catch(err => {
                            console.log('Service Worker registration failed:', err);
                        });
                    } else {
                        console.log('Service Worker disabled in dev mode');
                        // Unregister any existing service workers in dev
                        navigator.serviceWorker.getRegistrations().then(registrations => {
                            for (let registration of registrations) {
                                registration.unregister();
                            }
                        });
                    }
                })
                .catch(err => {
                    console.log('Failed to check environment, defaulting to no service worker:', err);
                });
        }
    </script>
</body>
</html>
