
services:
  zap-prod:
    build:
      context: .
      args:
        - GIT_BRANCH=main
        - USE_GIT=true  # Production builds from GitHub main branch
    ports:
      - "1337:3000"
    environment:
      - ENV=production
      - PORT=3000
    restart: unless-stopped
    command: npm start
    networks:
     - proxy-network

  zap-dev:
    build:
      context: .
      args:
        - GIT_BRANCH=dev
        - USE_GIT=false  # Development builds from local files
    ports:
      - "1338:3000"
    environment:
      - ENV=dev
      - PORT=3000
    volumes:
      - ./app:/app/app
      - ./server.js:/app/server.js
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped
    networks:
     - proxy-network

networks:
  proxy-network:
    external: true
