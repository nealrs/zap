<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bubbleGrad" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="shine" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="40%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0a1e" rx="96"/>
  
  <!-- Main bubble -->
  <circle cx="256" cy="256" r="180" fill="url(#bubbleGrad)"/>
  
  <!-- Shine effect -->
  <ellipse cx="200" cy="200" rx="80" ry="90" fill="url(#shine)" opacity="0.6"/>
  
  <!-- Smaller bubbles for decoration -->
  <circle cx="140" cy="380" r="45" fill="#34d399" opacity="0.7"/>
  <circle cx="380" cy="160" r="35" fill="#fbbf24" opacity="0.6"/>
  <circle cx="100" cy="120" r="28" fill="#60a5fa" opacity="0.5"/>
  
  <!-- Lightning bolt in center (zap) -->
  <path d="M 280 200 L 240 260 L 265 260 L 230 330 L 290 255 L 260 255 Z" 
        fill="#fbbf24" 
        stroke="#fb923c" 
        stroke-width="3"
        opacity="0.9"/>
</svg>
