<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Zap - Dev Mode</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Courier New', monospace;
            color: #00ff88;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #ffed4e;
            font-size: 48px;
            text-shadow: 0 0 20px rgba(255, 237, 78, 0.5);
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #4facfe;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .level-card {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #00ff88;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .level-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
            border-color: #ffed4e;
        }

        .level-number {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ffed4e;
            color: #000;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .level-name {
            color: #4facfe;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            padding-right: 60px;
        }

        .level-desc {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .level-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .stat {
            background: rgba(0, 255, 136, 0.1);
            padding: 8px;
            border-radius: 5px;
            font-size: 12px;
        }

        .stat-label {
            color: #888;
            display: block;
        }

        .stat-value {
            color: #00ff88;
            font-weight: bold;
            font-size: 16px;
        }

        .hazards {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #333;
        }

        .hazard-label {
            color: #ff6b6b;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .hazard-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .hazard-badge {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            color: #ff9999;
        }

        .special-badge {
            background: rgba(255, 237, 78, 0.2);
            border: 1px solid #ffed4e;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            color: #ffed4e;
            margin-top: 5px;
            display: inline-block;
        }

        .back-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff6b6b;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-button:hover {
            background: #ff4757;
            transform: scale(1.05);
        }

        #finale-test-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 2px solid rgba(79, 172, 254, 0.5);
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        #finale-test-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            border-color: rgba(79, 172, 254, 0.8);
            background: linear-gradient(135deg, #5fbdfe 0%, #10f2ff 100%);
        }

        @media (max-width: 768px) {
            .level-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 DEV MODE 🎮</h1>
        <div class="subtitle">Level Selector & Testing</div>
        
        <div style="text-align: center; margin-bottom: 20px;">
            <button id="finale-test-btn" onclick="window.location.href='/dev/finale'">
                ⭐ TEST FINALE SCREEN ⭐
            </button>
        </div>
        
        <div id="level-grid" class="level-grid">
            <!-- Levels will be populated here -->
        </div>
    </div>

    <script>
        // Check for direct level parameter (e.g., /dev?level=8)
        const urlParams = new URLSearchParams(window.location.search);
        const directLevel = urlParams.get('level');
        
        if (directLevel !== null) {
            const levelIndex = parseInt(directLevel) - 1; // Convert to 0-based index
            localStorage.setItem('devMode', 'true');
            localStorage.setItem('devLevel', levelIndex);
            window.location.href = '/';
        }
        
        // Fetch levels and populate grid
        fetch('/data/levels.json')
            .then(res => res.json())
            .then(levels => {
                const grid = document.getElementById('level-grid');
                
                levels.forEach((level, index) => {
                    const card = document.createElement('div');
                    card.className = 'level-card';
                    card.onclick = () => {
                        localStorage.setItem('devMode', 'true');
                        localStorage.setItem('devLevel', index);
                        window.location.href = '/';
                    };
                    
                    // Build hazards list
                    let hazardsHTML = '';
                    if (level.hazards && level.hazards.length > 0) {
                        const hazardTypes = level.hazards.map(h => h.type).join(', ');
                        hazardsHTML = `
                            <div class="hazards">
                                <div class="hazard-label">⚠️ HAZARDS:</div>
                                <div class="hazard-list">
                                    ${level.hazards.map(h => `<span class="hazard-badge">${h.type}</span>`).join('')}
                                </div>
                            </div>
                        `;
                    }
                    
                    // Special bubbles info
                    let specialHTML = '';
                    if (level.specialBubbles && level.specialBubbles.enabled) {
                        const types = level.specialBubbles.types.join(', ');
                        const interval = level.specialBubbles.spawnIntervalSeconds;
                        specialHTML = `<span class="special-badge">⭐ ${types} (every ${interval}s)</span>`;
                    }
                    
                    card.innerHTML = `
                        <div class="level-number">LVL ${index + 1}</div>
                        <div class="level-name">${level.name}</div>
                        <div class="level-desc">${level.desc}</div>
                        <div class="level-stats">
                            <div class="stat">
                                <span class="stat-label">Target</span>
                                <span class="stat-value">${level.target}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Time</span>
                                <span class="stat-value">${level.time}s</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Bubbles</span>
                                <span class="stat-value">${level.count}</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Size</span>
                                <span class="stat-value">${level.size}</span>
                            </div>
                        </div>
                        ${specialHTML}
                        ${hazardsHTML}
                    `;
                    
                    grid.appendChild(card);
                });
            })
            .catch(err => {
                console.error('Failed to load levels:', err);
                document.getElementById('level-grid').innerHTML = 
                    '<p style="color: #ff6b6b; text-align: center;">Failed to load levels</p>';
            });
    </script>
</body>
</html>
