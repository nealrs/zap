<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Zap - Dev Mode</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .container {
            max-width: 800px;
            width: 90%;
            text-align: center;
            padding: 40px 20px;
            margin: auto 0;
        }

        h1 {
            color: #fff;
            font-size: clamp(32px, 8vw, 64px);
            margin: 0 0 10px 0;
            background: linear-gradient(45deg, #ff6b6b, #ff4757);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            letter-spacing: 0.1em;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .dev-badge {
            display: inline-block;
            background: rgba(255, 107, 107, 0.2);
            border: 2px solid #ff6b6b;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: #ff6b6b;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 0.1em;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 0 auto 30px auto;
            padding: 10px;
        }

        .level-card {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff4757 100%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 20px 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .level-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 107, 107, 0.4);
        }

        .level-number {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .level-name {
            font-size: 14px;
            opacity: 0.9;
        }

        #finale-test-btn {
            background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 2px solid rgba(167, 139, 250, 0.5);
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        #finale-test-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(139, 92, 246, 0.4);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 32px;
            }
            
            .level-grid {
                max-height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DEV MODE</h1>
        <div class="subtitle">Developer Testing</div>
        <div class="dev-badge">⚠️ DEVELOPER ACCESS ⚠️</div>
        
        <div style="margin-bottom: 20px;">
            <button id="finale-test-btn" onclick="window.location.href='/dev/finale'">
                ⭐ TEST FINALE SCREEN
            </button>
        </div>
        
        <div style="margin-bottom: 20px;">
            <button id="finale-test-btn" onclick="window.location.href='/dev/audio.html'" style="background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%); border-color: rgba(96, 165, 250, 0.5);">
                🎵 AUDIO TEST
            </button>
        </div>
        
        <div id="level-grid" class="level-grid">
            <!-- Levels will be populated here -->
        </div>
    </div>

    <script>
        // Check for direct level parameter (e.g., /dev?level=8)
        const urlParams = new URLSearchParams(window.location.search);
        const directLevel = urlParams.get('level');
        
        if (directLevel !== null) {
            const levelIndex = parseInt(directLevel) - 1; // Convert to 0-based index
            localStorage.setItem('devMode', 'true');
            localStorage.setItem('devLevel', levelIndex);
            window.location.href = '/';
        }
        
        // Fetch levels and populate grid
        fetch('/data/levels.json')
            .then(res => res.json())
            .then(levels => {
                const grid = document.getElementById('level-grid');
                
                levels.forEach((level, index) => {
                    const card = document.createElement('div');
                    card.className = 'level-card';
                    card.onclick = () => {
                        localStorage.setItem('devMode', 'true');
                        localStorage.setItem('devLevel', index);
                        window.location.href = '/';
                    };
                    
                    card.innerHTML = `
                        <div class="level-number">Level ${index + 1}</div>
                        <div class="level-name">${level.name}</div>
                    `;
                    
                    grid.appendChild(card);
                });
            })
            .catch(err => {
                console.error('Failed to load levels:', err);
                document.getElementById('level-grid').innerHTML = 
                    '<p style="color: #ff6b6b;">Failed to load levels</p>';
            });
    </script>
</body>
</html>
